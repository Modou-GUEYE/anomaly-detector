# GitLab CI pipeline to build and push backend and frontend Docker images
# Uses GitLab's built-in registry with auto-provided credentials

variables:
  IMAGE_REGISTRY_HOST: "$CI_REGISTRY"
  IMAGE_REGISTRY_NS: "$CI_PROJECT_PATH"
  IMAGE_TAG: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"

stages:
  - build

build_and_push_backend:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  stage: build
  before_script:
    - echo "Registry: ${IMAGE_REGISTRY_HOST}"
    - echo "Namespace: ${IMAGE_REGISTRY_NS}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t ${IMAGE_REGISTRY_HOST}/${IMAGE_REGISTRY_NS}/anomaly-api:${IMAGE_TAG} ./backend
    - docker push ${IMAGE_REGISTRY_HOST}/${IMAGE_REGISTRY_NS}/anomaly-api:${IMAGE_TAG}
  only:
    - branches
    - tags

build_and_push_frontend:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  stage: build
  before_script:
    - echo "Registry: ${IMAGE_REGISTRY_HOST}"
    - echo "Namespace: ${IMAGE_REGISTRY_NS}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t ${IMAGE_REGISTRY_HOST}/${IMAGE_REGISTRY_NS}/anomaly-frontend:${IMAGE_TAG} ./frontend
    - docker push ${IMAGE_REGISTRY_HOST}/${IMAGE_REGISTRY_NS}/anomaly-frontend:${IMAGE_TAG}
  only:
    - branches
    - tags
