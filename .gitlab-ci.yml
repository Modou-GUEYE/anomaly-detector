# GitLab CI pipeline to build and push backend and frontend Docker images
# Uses GitLab's built-in registry with auto-provided credentials
# Runner "docker-shell" : exécuteur Docker. L'image docker:24 fournit le client docker, qui
# utilise le démon de la machine (pas de service docker:dind).

variables:
  IMAGE_REGISTRY_HOST: "$CI_REGISTRY"
  IMAGE_REGISTRY_NS: "$CI_PROJECT_PATH"

stages:
  - build

build_and_push_backend:
  image: docker:24
  tags:
    - docker-shell
  stage: build
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -t $CI_REGISTRY/$CI_PROJECT_PATH/anomaly-api:$IMAGE_TAG ./backend
    - docker push $CI_REGISTRY/$CI_PROJECT_PATH/anomaly-api:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build_and_push_frontend:
  image: docker:24
  tags:
    - docker-shell
  stage: build
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -t $CI_REGISTRY/$CI_PROJECT_PATH/anomaly-frontend:$IMAGE_TAG ./frontend
    - docker push $CI_REGISTRY/$CI_PROJECT_PATH/anomaly-frontend:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
