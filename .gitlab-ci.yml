# GitLab CI pipeline to build and push backend and frontend Docker images
# Expects the following CI variables to be set in the project/group settings:
# - CI_REGISTRY_USER (usually $CI_REGISTRY_USER provided by GitLab)
# - CI_REGISTRY_PASSWORD (a Personal Access Token or Deploy Token with write_registry)

variables:
  IMAGE_REGISTRY_HOST: "registry-gitlab.gsietechnology.com"
  IMAGE_REGISTRY_NS: "pisfn/lab-ft"
  IMAGE_TAG: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"

stages:
  - build
  - publish

.dind: &dind
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""

before_script:
  - echo "Logging in to registry ${IMAGE_REGISTRY_HOST}"
  - echo "$CI_REGISTRY_PASSWORD" | docker login ${IMAGE_REGISTRY_HOST} -u "$CI_REGISTRY_USER" --password-stdin

build_and_push_backend:
  <<: *dind
  stage: build
  script:
    - docker build -t ${IMAGE_REGISTRY_HOST}/${IMAGE_REGISTRY_NS}/anomaly-api:${IMAGE_TAG} ./backend
    - docker push ${IMAGE_REGISTRY_HOST}/${IMAGE_REGISTRY_NS}/anomaly-api:${IMAGE_TAG}
  only:
    - branches
    - tags

build_and_push_frontend:
  <<: *dind
  stage: build
  script:
    - docker build -t ${IMAGE_REGISTRY_HOST}/${IMAGE_REGISTRY_NS}/anomaly-frontend:${IMAGE_TAG} ./frontend
    - docker push ${IMAGE_REGISTRY_HOST}/${IMAGE_REGISTRY_NS}/anomaly-frontend:${IMAGE_TAG}
  only:
    - branches
    - tags
