<div class="login-page">
  <div class="overlay"></div>
  <div class="container">
    <div class="card">
      @if (isLoadingMessage) {
        <div class="loading-overlay">
          <mat-icon class="loading-icon">hourglass_top</mat-icon>
          <span>Connexion en cours...</span>
        </div>
      }

      <header class="header">
        <div class="logo-wrapper">
          <img src="assets/logo.png" alt="Logo Bank" class="login-logo" />
        </div>
        <h1>Connexion</h1>
        <p class="subtitle">Accédez à votre espace de lutte contre le blanchiment et le financement du terrorisme (LBC/FT).</p>
      </header>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="form-container">
        <div class="form-field">
          <label for="login-email">Adresse email</label>
          <div class="input-group">
            <mat-icon class="prefix-icon">alternate_email</mat-icon>
            <input
              id="login-email"
              type="email"
              name="email"
              autocomplete="email"
              [(ngModel)]="email"
              [disabled]="isLoadingMessage"
              required
              placeholder="Votre adresse email"
            />
          </div>
        </div>

        <div class="form-field">
          <label for="login-password">Mot de passe</label>
          <div class="input-group">
            <mat-icon class="prefix-icon">lock_outline</mat-icon>
            <input
              id="login-password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [attr.autocomplete]="showPassword ? 'off' : 'current-password'"
              [(ngModel)]="password"
              [disabled]="isLoadingMessage"
              required
              placeholder="Votre mot de passe"
            />
            <button type="button" class="eye-toggle" (click)="togglePasswordVisibility()" [disabled]="isLoadingMessage">
              <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>

        <div class="form-row-options">
          <div class="error-inline">
            @if (message && !isLoadingMessage) {
              <span [class.error-text]="!success" [class.success-text]="success">
                {{ message }}
              </span>
            }
          </div>
          <div class="forgot-link">
            <a routerLink="/forgot-password">Mot de passe oublié ?</a>
          </div>
        </div>

        <button type="submit" class="btn-submit" [disabled]="!loginForm.form.valid || isLoadingMessage">
          <mat-icon>login</mat-icon>
          <span>Se connecter</span>
        </button>
      </form>
    </div>
  </div>
</div>
