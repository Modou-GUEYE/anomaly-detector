<div class="login-page">
  <div class="overlay"></div>
  <div class="container">
    <div class="card">
      @if (isLoadingMessage) {
        <div class="loading-float">
          <mat-icon class="loading-icon">hourglass_top</mat-icon>
          <span>{{ message || 'Connexion...' }}</span>
        </div>
      }
      <header class="header">
        <div class="icon-circle">
          <mat-icon>account_circle</mat-icon>
        </div>
        <h1>Connexion</h1>
        <p class="subtitle">Accédez à votre espace de lutte contre le blanchiment et le financement du terrorisme (LBC/FT).</p>
      </header>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="form-container">
        <div class="form-field">
          <label>Adresse email</label>
          <div class="input-group">
            <mat-icon class="prefix-icon">alternate_email</mat-icon>
            <input
              type="email"
              name="email"
              autocomplete="email"
              [(ngModel)]="email"
              required
              placeholder="Votre adresse email"
            />
          </div>
        </div>

        <div class="form-field">
          <label>Mot de passe</label>
          <div class="input-group">
            <mat-icon class="prefix-icon">lock_outline</mat-icon>
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              autocomplete="current-password"
              [(ngModel)]="password"
              required
              placeholder="Votre mot de passe"
            />
            <button type="button" class="eye-toggle" (click)="togglePasswordVisibility()">
              <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" [disabled]="!loginForm.form.valid">
          <mat-icon>login</mat-icon>
          <span>Se connecter</span>
        </button>

        @if (message && !isLoadingMessage) {
          <div [ngClass]="isLoadingMessage ? 'msg-info' : (success ? 'msg-success' : 'msg-error')" class="feedback">
            {{ message }}
          </div>
        }
      </form>
    </div>
  </div>
</div>
