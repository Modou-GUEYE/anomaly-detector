<div class="login-page">
  <!-- header removed: logos not displayed as requested -->

  <main class="login-center">
    <div class="login-panel">
      <h2 class="login-panel__title">Connexion</h2>
      <p class="login-panel__subtitle">Ce moteur aide à détecter les anomalies et à lutter contre le blanchiment et le financement du terrorisme (LBC/FT).</p>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
  <!-- label removed to match prototype -->

        <input type="email" name="email" autocomplete="email" [(ngModel)]="email" required placeholder="Votre adresse email" class="input" />

        <div class="password-row">
          <input [type]="showPassword ? 'text' : 'password'" name="password" autocomplete="current-password" [(ngModel)]="password" required placeholder="Votre mot de passe" class="input" />
          <button type="button" class="eye" aria-label="Montrer / cacher mot de passe" (click)="togglePasswordVisibility()" [attr.aria-pressed]="showPassword">
            <img [src]="showPassword ? '/assets/eye-off.svg' : '/assets/eye.svg'" alt="toggle" />
          </button>
        </div>

        <button type="submit" class="login-btn" [disabled]="!loginForm.form.valid">Se Connecter</button>

        <div *ngIf="message" [ngClass]="isLoadingMessage ? 'msg-info' : (success ? 'msg-success' : 'msg-error')" class="feedback">{{ message }}</div>

  <div class="signup">Nouvel utilisateur ? <a routerLink="/signin">Cliquez ici</a> pour créer un compte.</div>
      </form>
    </div>
  </main>
</div>
