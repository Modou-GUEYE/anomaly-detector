<div class="login-page">
  <main class="login-center">
    <div class="login-panel">
      <h2 class="login-panel__title">Inscription</h2>
      <p class="login-panel__subtitle">Ce moteur aide à détecter les anomalies et à lutter contre le blanchiment et le financement du terrorisme (LBC/FT).</p>

      <form (ngSubmit)="submit()" #signinForm="ngForm" class="login-form">

        <div class="name-row">
          <input type="text" name="prenom" [(ngModel)]="prenom" required placeholder="Prénom *" class="input" />
          <input type="text" name="nom" [(ngModel)]="nom" required placeholder="Nom *" class="input" />
        </div>

        <input type="email" name="email" [(ngModel)]="email" required placeholder="Email *" class="input" />

        <select name="role" [(ngModel)]="role" class="input" required>
          <option value="" disabled>Sélectionnez votre rôle *</option>
          <option *ngFor="let opt of roles" [value]="opt.value">{{ opt.label }}</option>
        </select>

        <div class="password-row">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" required placeholder="Votre mot de passe" class="input" />
          <button type="button" class="eye" aria-label="Montrer / cacher mot de passe" (click)="togglePassword()">
            <img [src]="showPassword ? '../../../assets/eye-off.svg' : '../../../assets/eye.svg'" alt="toggle" />
          </button>
        </div>

        <label class="policy">
          <input type="checkbox" name="policy" [(ngModel)]="acceptedPolicy" />
          <span class="policy-text">J'accepte la politique et les conditions d'utilisation</span>
        </label>

        <button type="submit" class="login-btn" [disabled]="loading">S'inscrire</button>

        <div *ngIf="message" [ngClass]="success ? 'msg-success' : 'msg-error'" class="feedback">
          {{ message }}
        </div>

        <div class="signup">Vous avez déjà un compte ? <a routerLink="/login">Cliquez ici</a> pour vous connecter.</div>
      </form>
    </div>
  </main>
</div>
