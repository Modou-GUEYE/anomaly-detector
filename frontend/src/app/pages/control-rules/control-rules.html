<section class="control-rules-page">
  <h1>Règles de Contrôle</h1>

  <div class="rules-header">
    <button class="btn-primary" (click)="addRule()">+ Ajouter une règle</button>
  </div>

  <div *ngIf="loading" class="loading">Chargement des règles...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!loading && rules.length > 0" class="rules-grid">
    <div *ngFor="let rule of rules" class="rule-card">
      <div class="rule-header">
        <h3>{{ rule.name }}</h3>
        <span class="rule-status" [class.active]="rule.status === 'Actif'">{{ rule.status }}</span>
      </div>
      
      <p class="rule-description">{{ rule.description }}</p>
      
      <div class="rule-details">
        <div class="detail-item">
          <span class="label">Type:</span>
          <span class="value">{{ rule.type }}</span>
        </div>
        <div class="detail-item" *ngIf="rule.threshold > 0">
          <span class="label">Seuil:</span>
          <span class="value">{{ rule.threshold | number }}</span>
        </div>
      </div>

      <div class="rule-actions">
        <button class="btn-edit" (click)="editRule(rule)">Éditer</button>
        <button class="btn-delete" (click)="deleteRule(rule.id)">Supprimer</button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && rules.length === 0" class="empty-state">
    <p>Aucune règle de contrôle trouvée.</p>
    <button class="btn-primary" (click)="addRule()">Créer une règle</button>
  </div>
</section>
