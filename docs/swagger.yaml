basePath: /api/v1
definitions:
  models.Alerte:
    description: Alerte générée lors du déclenchement d'une règle
    properties:
      analysteAssigneId:
        type: string
      dateGeneration:
        type: string
      id:
        type: string
      niveauCriticite:
        type: string
      raisonDetection:
        type: string
      regleDeclencheeId:
        type: string
      scoreRisque:
        type: number
      statut:
        description: '"En cours", "Traité", "Faux positif"'
        type: string
      transactionId:
        type: string
    type: object
  models.Client:
    description: Client du système (personne physique ou morale) obtenu lors de l'analyse
      des transactions
    properties:
      adresse:
        type: string
      categorie:
        type: string
      dateCreation:
        type: string
      id:
        type: string
      nomClient:
        type: string
      numeroCompte:
        type: string
      pays:
        type: string
      profilClientId:
        type: string
      typeClient:
        type: string
      typeCompte:
        type: string
      ville:
        type: string
    type: object
  models.EntiteBlacklist:
    description: Entité sous surveillance (Blacklist, PEP, etc.)
    properties:
      dateAjout:
        type: string
      id:
        type: string
      informationsSupplementaires:
        type: string
      nom:
        type: string
      numeroCompte:
        description: Numéro de compte pour vérification
        type: string
      typeEntite:
        description: '"Interdit", "Blacklisté", "PEP", "Surveillé"'
        type: string
    type: object
  models.LogAudit:
    description: Log d'audit des actions critiques
    properties:
      actionEffectuee:
        type: string
      dateHeure:
        type: string
      details:
        type: string
      id:
        type: integer
      resultat:
        type: string
      utilisateurId:
        type: string
    type: object
  models.ProfilClient:
    description: Profil de client avec règles spécifiques
    properties:
      description:
        type: string
      id:
        type: string
      nomProfil:
        type: string
    type: object
  models.RegleControle:
    description: Règle de contrôle pour la détection d'anomalies
    properties:
      active:
        type: boolean
      criticite:
        type: string
      description:
        type: string
      id:
        type: string
      listePays:
        items:
          type: string
        type: array
      nomRegle:
        type: string
      periodeReference:
        type: string
      profilClientId:
        type: string
      seuil:
        type: number
      typeRegle:
        description: 'Ex: "montant", "frequence"'
        type: string
    type: object
  models.Transaction:
    description: Transaction financière entre deux entités
    properties:
      adresse_paye:
        type: string
      adresse_payeur:
        type: string
      categorie_paye:
        type: string
      categorie_payeur:
        type: string
      date_operation:
        type: string
      id:
        type: string
      montant:
        type: number
      nom_paye:
        type: string
      nom_payeur:
        type: string
      numero_compte_paye:
        type: string
      numero_compte_payeur:
        type: string
      pays_paye:
        type: string
      pays_payeur:
        type: string
      portee:
        type: string
      type_client_paye:
        type: string
      type_client_payeur:
        type: string
      type_compte_paye:
        type: string
      type_compte_payeur:
        type: string
      ville_paye:
        type: string
      ville_payeur:
        type: string
    type: object
  models.Utilisateur:
    description: Utilisateur du système (admin ou analyste)
    properties:
      actif:
        type: boolean
      dateCreation:
        type: string
      email:
        type: string
      id:
        type: string
      nomUtilisateur:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: modou.gueye@gsietechnology.com
    name: Modou GUEYE
  description: Backend pour le projet MDA de GSIE Technology, conçu pour la détection
    de fraudes LBC/FT.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://gsietechnology.com/terms
  title: API du Moteur de Détection d'Anomalies
  version: "1.0"
paths:
  /alertes:
    get:
      description: Récupère la liste de toutes les alertes générées par le système.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Alerte'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lister toutes les alertes
      tags:
      - Analystes - Alertes
  /alertes/{id}/status:
    put:
      consumes:
      - application/json
      description: 'Permet à un analyste de changer le statut d''une alerte (ex: ''Traité'',
        ''Faux positif'').'
      parameters:
      - description: ID de l'alerte
        in: path
        name: id
        required: true
        type: string
      - description: Nouveau statut de l'alerte
        in: body
        name: status
        required: true
        schema:
          properties:
            statut:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Alerte'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mettre à jour le statut d'une alerte
      tags:
      - Analystes - Alertes
  /blacklist:
    get:
      description: Récupère toutes les entités de la liste de surveillance. Nécessite
        des droits admin.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EntiteBlacklist'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lister les entrées de la blacklist
      tags:
      - Administration - Blacklist
    post:
      consumes:
      - application/json
      description: Ajoute une nouvelle entité à la liste de surveillance. Nécessite
        des droits admin.
      parameters:
      - description: Détails de l'entité à ajouter
        in: body
        name: blacklistEntry
        required: true
        schema:
          $ref: '#/definitions/models.EntiteBlacklist'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.EntiteBlacklist'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Créer une entrée dans la blacklist
      tags:
      - Administration - Blacklist
  /blacklist/{id}:
    delete:
      description: Supprime une entité de la liste de surveillance par son ID. Nécessite
        des droits admin.
      parameters:
      - description: ID de l'entité
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Supprimer une entrée de la blacklist
      tags:
      - Administration - Blacklist
    put:
      consumes:
      - application/json
      description: Modifie une entité de la liste de surveillance. Nécessite des droits
        admin.
      parameters:
      - description: ID de l'entité
        in: path
        name: id
        required: true
        type: string
      - description: Nouvelles données de l'entité
        in: body
        name: blacklistEntry
        required: true
        schema:
          $ref: '#/definitions/models.EntiteBlacklist'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EntiteBlacklist'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mettre à jour une entrée de la blacklist
      tags:
      - Administration - Blacklist
  /clients:
    post:
      consumes:
      - application/json
      description: Crée un nouveau client et l'associe à un profil. Nécessite des
        droits admin.
      parameters:
      - description: Détails du client
        in: body
        name: client
        required: true
        schema:
          $ref: '#/definitions/models.Client'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Client'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Créer un client
      tags:
      - Administration - Clients
  /demo/logs:
    get:
      description: Retourne une liste de logs d'audit pour exposer le modèle LogAudit
        dans Swagger
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LogAudit'
            type: array
      summary: Lister les logs d'audit (exemple)
      tags:
      - Administration - Démo
  /login:
    post:
      consumes:
      - application/json
      description: Authentifie un utilisateur avec email et mot de passe et renvoie
        un token JWT.
      parameters:
      - description: Identifiants de l'utilisateur
        in: body
        name: credentials
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Renvoie un token JWT
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Connecter un utilisateur
      tags:
      - Authentification
  /profile:
    get:
      description: Renvoie les informations de l'utilisateur actuellement authentifié
        via le token JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Utilisateur'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtenir le profil de l'utilisateur connecté
      tags:
      - Utilisateurs
  /profils:
    get:
      description: Récupère tous les profils clients. Nécessite des droits admin.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ProfilClient'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lister les profils clients
      tags:
      - Administration - Profils
    post:
      consumes:
      - application/json
      description: Crée un nouveau profil client. Nécessite des droits admin.
      parameters:
      - description: Détails du profil
        in: body
        name: profil
        required: true
        schema:
          $ref: '#/definitions/models.ProfilClient'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ProfilClient'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Créer un profil client
      tags:
      - Administration - Profils
  /profils/{id}:
    delete:
      description: Supprime un profil client. Nécessite des droits admin.
      parameters:
      - description: ID du profil
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Supprimer un profil client
      tags:
      - Administration - Profils
    put:
      consumes:
      - application/json
      description: Modifie un profil client. Nécessite des droits admin.
      parameters:
      - description: ID du profil
        in: path
        name: id
        required: true
        type: string
      - description: Nouvelles données du profil
        in: body
        name: profil
        required: true
        schema:
          $ref: '#/definitions/models.ProfilClient'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProfilClient'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mettre à jour un profil client
      tags:
      - Administration - Profils
  /profils/{id}/regles:
    get:
      description: Récupère toutes les règles associées à un profil client. Nécessite
        des droits admin.
      parameters:
      - description: ID du Profil Client
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.RegleControle'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lister les règles d'un profil
      tags:
      - Administration - Règles
  /regle/pays_risque/pays:
    delete:
      consumes:
      - application/json
      description: Permet à un admin de retirer un pays de la liste sans toucher aux
        autres.
      parameters:
      - description: Pays à retirer
        in: body
        name: pays
        required: true
        schema:
          properties:
            pays:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Retirer un pays de la liste des pays à risque
      tags:
      - Administration - Règles
    get:
      description: Récupère la liste actuelle des pays à risque de la règle universelle.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              liste_pays:
                items:
                  type: string
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtenir la liste des pays à risque
      tags:
      - Administration - Règles
    post:
      consumes:
      - application/json
      description: Permet à un admin d'ajouter un pays à la liste sans écraser les
        autres.
      parameters:
      - description: Pays à ajouter
        in: body
        name: pays
        required: true
        schema:
          properties:
            pays:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ajouter un pays à la liste des pays à risque
      tags:
      - Administration - Règles
    put:
      consumes:
      - application/json
      description: Permet à un admin de modifier la liste des pays à risque de la
        règle universelle.
      parameters:
      - description: Nouvelle liste des pays à risque
        in: body
        name: pays
        required: true
        schema:
          properties:
            liste_pays:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mettre à jour la liste des pays à risque
      tags:
      - Administration - Règles
  /regles:
    post:
      consumes:
      - application/json
      description: Crée une nouvelle règle de contrôle. Nécessite des droits admin.
      parameters:
      - description: Détails de la règle
        in: body
        name: regle
        required: true
        schema:
          $ref: '#/definitions/models.RegleControle'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.RegleControle'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Créer une règle de contrôle
      tags:
      - Administration - Règles
  /regles/{id}:
    delete:
      description: Supprime une règle de contrôle. Nécessite des droits admin.
      parameters:
      - description: ID de la règle
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Supprimer une règle de contrôle
      tags:
      - Administration - Règles
    put:
      consumes:
      - application/json
      description: Modifie une règle de contrôle. Nécessite des droits admin.
      parameters:
      - description: ID de la règle
        in: path
        name: id
        required: true
        type: string
      - description: Nouvelles données de la règle
        in: body
        name: regle
        required: true
        schema:
          $ref: '#/definitions/models.RegleControle'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RegleControle'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mettre à jour une règle de contrôle
      tags:
      - Administration - Règles
  /transactions/analyze:
    post:
      consumes:
      - application/json
      description: Soumet une transaction pour analyse par le MDA, en appliquant les
        règles à la fois pour le client source et le client destinataire.
      parameters:
      - description: Détails de la transaction à analyser
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/models.Transaction'
      produces:
      - application/json
      responses:
        "200":
          description: Aucune anomalie détectée
          schema:
            additionalProperties:
              type: string
            type: object
        "201":
          description: Anomalie(s) détectée(s) et alerte(s) créée(s)
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Transaction refusée (client interdit)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Analyser une transaction (bidirectionnel)
      tags:
      - Moteur de Détection
  /users:
    post:
      consumes:
      - application/json
      description: Crée un nouvel utilisateur (admin ou analyste).
      parameters:
      - description: Le mot de passe doit être dans le champ 'password'
        in: body
        name: utilisateur
        required: true
        schema:
          $ref: '#/definitions/models.Utilisateur'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Créer un nouvel utilisateur
      tags:
      - Authentification
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Type 'Bearer' suivi par un espace et un token JWT.
    in: header
    name: Authorization
    type: apiKey
    x-logo: https://gsietechnology.com/logo.png
swagger: "2.0"
