version: "3.8"
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: anomaly-detector/api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./anomaly.env
    # If you mount the key directory from host, uncomment and adapt:
    # volumes:
    #   - /etc/anomaly-detector/keys:/etc/anomaly-detector/keys:ro
    # If you want a local Postgres for testing, add a db service or point DATABASE_URL to a test DB

